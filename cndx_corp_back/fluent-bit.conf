[SERVICE]
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_PORT    2020
    
[SERVICE]
    Flush           5
    Daemon          off
    Log_Level       info

[INPUT]
    Name          tail
    Tag           logs.${K8S_NAMESPACE}-${K8S_POD_NAME}
    Path          /var/log/container/*
    Mem_Buf_Limit 10m

[INPUT]
    Name         cpu
    Tag          metrics.cpu.${K8S_NAMESPACE}-${K8S_POD_NAME}
    Interval_Sec 1

[INPUT]
    Name          disk
    Tag           metrics.disk.${K8S_NAMESPACE}-${K8S_POD_NAME}
    Interval_Sec  1
    Interval_NSec 0

[INPUT]
    Name   mem
    Tag    metrics.memory.${K8S_NAMESPACE}-${K8S_POD_NAME}

[INPUT]
    Name          netif
    Tag           metrics.netif.${K8S_NAMESPACE}-${K8S_POD_NAME}
    Interval_Sec  1
    Interval_NSec 0
    Interface     eth0

[OUTPUT]
    Name          forward
    Match         *
    Host          fluentd.airflow-dev.svc.cluster.local
    Port          24224

[OUTPUT]
    Name   file
    Match  *
    Path   /tmp/log/fluent-bit.log
    Format json_lines

[OUTPUT]
    Name  stdout
    Match *
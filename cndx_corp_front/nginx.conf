server {
    listen 80;
    server_name localhost;
    # デフォルトのパスを設定
    root /usr/share/nginx/html;
    # デフォルトのファイルを設定
    index index.html;
 
    # エラーログを設定
    error_log  /var/log/nginx/error_fluentd.log debug;
    # アクセスログを設定
    access_log /var/log/nginx/access_fluentd.log;
 
    # 静的ファイルのパスを設定
    location /public/ {
        alias /usr/share/nginx/html/public;
        try_files $uri $uri/ @remix;
    }
 
    # remixサーバーにリクエストを転送
    location / {
        proxy_pass http://cndx-corp-front-step3:3000;
        client_max_body_size 100M;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    1200s;
        send_timeout          300s;
    }
 
    location /api/ {
        proxy_pass http://cndx-corp-back-step3.middle-s2-stg.svc.cluster.local:5000;
        client_max_body_size 100M;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    1200s;
        send_timeout          300s;
    }
 
    # エラーページを設定
    error_page 403 404 /index.html;
 
    # Remixサーバーにリクエストを転送(静的ファイルがない場合)
    location @remix {
        proxy_pass http://cndx-corp-front-step3:3000;
    }
}
